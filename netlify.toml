# 哪都通 · 纯静态站点，无需构建（Netlify 备用部署用；主站是 Cloudflare Pages，走 _headers）
[build]
  publish = "."

# 具体规则写在前面：Netlify 对同一个响应头以先命中的规则为准
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 单页应用（hash 路由，无需额外重写规则，这里仅做兜底）
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

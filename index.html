<style id="page-preloader-critical">
/* 页面加载动效（关键内联样式，保证首屏即刻渲染） */
#page-preloader{position:fixed;inset:0;z-index:99999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease,visibility .5s ease;}
#page-preloader.is-done{opacity:0;visibility:hidden;pointer-events:none;}
#page-preloader .pl-logo{position:relative;width:88px;height:88px;display:grid;place-items:center;}
#page-preloader .pl-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 90deg,#243B9B,#E8874A,#243B9B);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3.5px));animation:plrotate .9s linear infinite;}
#page-preloader .pl-mark{width:58px;height:58px;border-radius:14px;background:#243B9B;display:grid;place-items:center;box-shadow:0 8px 20px rgba(36,59,155,.22);}
#page-preloader .pl-name{margin-top:20px;font-size:18px;font-weight:900;color:#1F2433;letter-spacing:4px;}
#page-preloader .pl-tip{margin-top:7px;font-size:12px;color:#6A7185;letter-spacing:1px;}
#page-preloader .pl-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#EEF1F8;overflow:hidden;}
#page-preloader .pl-bar span{display:block;height:100%;width:40%;border-radius:0 999px 999px 0;background:linear-gradient(90deg,#243B9B,#E8874A);animation:plslide 1.1s ease-in-out infinite;}
@keyframes plrotate{to{transform:rotate(360deg);}}
@keyframes plslide{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
@media(prefers-reduced-motion:reduce){#page-preloader .pl-ring,#page-preloader .pl-bar span{animation:none;}}
</style>
